<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>RedsScheduler</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><span class="eyebrow">REDSTONEINVENTE</span><h1>RedsScheduler</h1><p>Protect the deadline. Move the work.</p></div><button id="addBtn">+ New task</button></header>
<main>
<section class="stats" id="stats"></section>
<section class="toolbar"><div><strong>Schedule</strong><span id="status"></span></div><label>Daily hours <input id="hours" type="number" min="1" max="16" step=".5" value="8"></label><label>Buffer <input id="buffer" type="number" min="0" max="60" value="30">%</label><button id="rebalance">Rebalance</button></section>
<section class="grid"><div class="panel"><h2>Timeline</h2><div id="timeline"></div></div><aside class="panel"><h2>Scheduler decisions</h2><div id="decisions"></div><h2>Backlog</h2><div id="backlog"></div></aside></section>
</main>
<dialog id="taskDialog"><form id="taskForm" method="dialog"><h2>Add work</h2><label>Task<input name="title" required placeholder="e.g. Fix checkout interaction"></label><div class="two"><label>Estimate (hours)<input name="estimate" type="number" min=".25" step=".25" required value="4"></label><label>Priority<select name="priority"><option value="5">P0 Critical</option><option value="3" selected>P1 Important</option><option value="1">P2 Nice to have</option></select></label></div><label>Deadline<input name="date" type="date"></label><label class="check"><input name="hard" type="checkbox"> Hard deadline / milestone</label><label>Depends on<input name="depends" placeholder="Optional task name"></label><div class="actions"><button type="button" id="cancel">Cancel</button><button value="default">Schedule intelligently</button></div></form></dialog>
<script src="app.js"></script></body></html>
